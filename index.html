<!DOCTYPE html>
<html lang="en" class="">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="src/css/style.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/katex@0.16.25/dist/katex.min.css"
      integrity="sha384-WcoG4HRXMzYzfCgiyfrySxx90XSl2rxY5mnVY5TwtWE6KLrArNKn0T/mOgNL0Mmi"
      crossorigin="anonymous"
    />
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/katex@0.16.25/dist/katex.min.js"
      integrity="sha384-J+9dG2KMoiR9hqcFao0IBLwxt6zpcyN68IgwzsCSkbreXUjmNVRhPFTssqdSGjwQ"
      crossorigin="anonymous"
    ></script>
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/katex@0.16.25/dist/contrib/auto-render.min.js"
      integrity="sha384-hCXGrW6PitJEwbkoStFjeJxv+fSOOQKOPbJxSfM6G5sWZjAyWhXiTIIAmQqnlLlh"
      crossorigin="anonymous"
    ></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
      #pilihan_ganda button.is-active {
        background:linear-gradient(to top, #1c37ad, #2567c9);
        border-color: var(--color-blue-600, #2563eb);
        color: var(--color-white, #fff);
      }
    </style>
  </head>
  <body class="bg-blue-50 flex flex-col overflow-x-hidden">
    <!-- header -->s
    <header
      class="bg-linear-to-b from-blue-500 to-blue-600 fixed top-0 left-0 w-full text-white shadow-black/30 shadow-2xl flex items-center px-5 py-3"
    >
      <div class="font-sans px-4 py-0.5 text-base cursor-pointer flex" onclick="location.reload()">
        <img src="./src/imgs/quiz.png" alt="quiz logo" class="w-10 h-10" />
        <h3 class="pt-3 px-3">LEARNING APP</h3>
      </div>
    </header>

    <!-- content -->
    <main class="flex flex-col sm:flex-row py-24 sm:my-24 px-10 md:py-10 gap-5 lg:px-10">
      <!-- Sidebar (profil) -->
      <aside class="bg-white w-full md:w-80 rounded-lg shadow-2xl p-6 flex flex-col items-center text-sm">
        <div id="form" class="flex flex-col gap-3">
          <div class="pt-2 pb-4 w-full">
            <h3 class="font-sans font-semibold text-md text-black text-center text-shadow-md/20">FORMULIR LATIHAN</h3>
          </div>
          <div>
            <label class="text-shadow-md/5" for="nama">Masukkan Nama:</label>
            <input id="inputNama" type="text" class="py-4 border w-full mt-1 rounded-md border-gray-400 h-6 p-2" />
          </div>
          <div>
            <label class="text-shadow-md/5" for="jenjang">Pilih Jenjang:</label>
            <select name="" id="selectJenjang" class="py-1.5 px-3 border w-full rounded-md border-gray-400"></select>
          </div>
          <div id="pKelas" class="hidden">
            <label class="text-shadow-md/5" for="kelas">Pilih Kelas:</label>
            <select name="" id="selectKelas" class="py-1.5 px-3 border w-full rounded-md border-gray-400"></select>
          </div>
          <div>
            <label class="text-shadow-md/5" for="mapel">Pilih Mapel:</label>
            <select name="" id="selectMapel" class="py-1.5 px-3 border w-full rounded-md border-gray-400"></select>
          </div>
          <div class="justify-center text-center w-full pt-5">
            <button
              id="btn-mulai"
              class="font-bold font-sans px-7 py-1.5 rounded-sm text-white bg-linear-to-t from-blue-500 to-blue-400 hover:bg-blue-500 hover:cursor-pointer"
            >
              MULAI
            </button>
          </div>
        </div>

        <div id="informasi" class="w-full space-y-2">
          <div
            id="initial"
            class="bg-linear-to-br from-blue-200 to-blue-400 text-white font-mono font-semibold text-xl flex items-center mt-5 justify-center rounded-full w-16 h-16 mb-2 mx-auto"
          >
            NF
          </div>
          <h3 id="nama" class="font-mono italic text-xl font-bold mx-auto text-center w-full mb-10">Nama</h3>
          <div class="bg-gray-50 shadow-md rounded-md py-4 px-4">
            <div class="flex justify-between text-xs">
              <span class="text-gray-600">Jenjang</span><span id="jenjang">XI IPA 2</span>
            </div>
            <div class="flex justify-between text-xs">
              <span class="text-gray-600">Kelas</span><span id="kelas">20251123</span>
            </div>
            <div class="flex justify-between text-xs">
              <span class="text-gray-600">Mapel</span><span id="mapel">01:00</span>
            </div>
            <div class="flex justify-between text-xs">
              <span class="text-gray-600">Skor</span><span id="score">0</span>
            </div>
          </div>
        </div>
      </aside>

      <!-- panel soal -->
      <div class="w-full h-auto p-5 shadow-2xl rounded-2xl bg-white">
        <div id="pStart" class="h-72 md:h-full">
          <div class="flex flex-col justify-center items-center rounded-lg bg-gray-50 h-full w-full shadow-md">
            <div class="flex justify-center items-center gap-2">
              <img src="./src/imgs/quiz.png" alt="" class="w-10 h-10" />
              <div class="h-10 flex items-center">
                <h3 class="font-semibold text-sm md:text-base pt-2">LEARNING APP</h3>
              </div>
            </div>
          </div>
        </div>
        <div id="pSoal" class="hidden">
          <div class="font-semibold text-sm md:text-base">
            Soal <span id="s-number">1</span> dari <span id="s-total">15</span>
          </div>
          <div class="font-semibold mt-3" id="soal">
            </div>
          <div id="pilihan_ganda" class="flex flex-wrap mt-4 -m-2">
            <div class="w-full p-2 md:w-1/2">
              <button
                data-jawaban="a"
                class="max-h-32 font-semibold font-sans p-2.5 w-full border rounded-md hover:bg-gray-200 cursor-pointer"
              >
                A.
                <span id="pilihan_a">Jawaban A</span>
              </button>
            </div>
            <div class="w-full p-2 md:w-1/2">
              <button
                data-jawaban="b"
                class="max-h-32 font-semibold font-sans p-2.5 w-full border rounded-md hover:bg-gray-200 cursor-pointer"
              >
                B.
                <span id="pilihan_b">Jawaban B</span>
              </button>
            </div>
            <div data-jawaban="c" class="w-full p-2 md:w-1/2">
              <button
                class="max-h-32 font-semibold font-sans p-2.5 w-full border rounded-md hover:bg-gray-200 cursor-pointer"
              >
                C.
                <span id="pilihan_c">Jawaban C</span>
              </button>
            </div>
            <div data-jawaban="d" class="w-full p-2 md:w-1/2">
              <button
                class="max-h-32 font-semibold font-sans p-2.5 w-full border rounded-md hover:bg-gray-200 cursor-pointer"
              >
                D.
                <span id="pilihan_d">Jawaban D</span>
              </button>
            </div>
          </div>
          <div id="jawaban_pendek" class="pt-8 hidden">
            <textarea
              name=""
              id="jawaban"
              class="border w-full rounded-xl border-gray-600 p-2 max-h-32"
              placeholder="Ketik jawaban Anda di sini..."
            ></textarea>
          </div>
          <div id="next-btn" class="mt-5 w-32 h-auto rounded-xl hidden">
            <button
              class="px-7 py-1 rounded-sm text-white bg-linear-to-t from-blue-500 to-blue-400 hover:cursor-pointer align"
            >
              Selanjutnya
            </button>
          </div>
        </div>
      </div>
    </main>

    <!-- footer -->
    <footer
      class="fixed bottom-0 left-0 w-full bg-linear-to-t from-blue-500 to-blue-600 text-white shadow-black/30 shadow-2xl flex items-center justify-center px-5 py-4"
    >
      <div class="text-center">
        <h3>&copy; 2025 LearningApp. Semua hak dilindungi.</h3>
      </div>
    </footer>

    <script
      src="https://code.jquery.com/jquery-3.7.1.min.js"
      integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
      crossorigin="anonymous"
    ></script>
    <script type="module" src="src/js/index.js"></script>
  </body>
</html>
